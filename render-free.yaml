# ==========================================================================
# ServoraBd -- free-tier blueprint, for getting the project on the internet.
#
#   Use this file when you want a live demo at no cost. Use render.yaml for
#   anything with real users.
#
# What the free tier costs you, and it is not money:
#   * The database lives on Neon's free plan, not Render: paste its
#     connection string into DATABASE_URL.
#   * The API sleeps after 15 minutes idle; the next visit takes ~50s.
#   * Cron services do not exist on free, so the seven scheduled jobs do not
#     run. Bookings will not auto-expire, reviews will not auto-reveal.
#   * Uploads land on a disk that is wiped on every deploy and every restart.
#
# None of that stops the site working for a walkthrough. All of it stops it
# being suitable for real users.
# ==========================================================================

services:
  - type: web
    name: servorabd-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn --config ../deploy/gunicorn.conf.py"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # One worker: the free instance has 512 MB and no traffic to speak of.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      # Left blank on purpose: prod.py falls back to Render's own
      # RENDER_EXTERNAL_HOSTNAME, so the service answers on its .onrender.com
      # address without you setting anything. Fill these in for a custom domain.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # No bucket on the free tier: uploads go to the container's own disk and
      # disappear on redeploy. Switch this to True and fill in the S3_* keys
      # once you have a bucket.
      - key: USE_OBJECT_STORAGE
        value: "False"
      # No SMTP: prod.py discards mail instead of refusing to boot. OTP login
      # codes are e-mailed, so registration needs these before it works.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: web
    name: servorabd-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      # These forward the browser's same-origin calls to the API service. If
      # Render gives your API a different name, change the host in all four.
      - type: rewrite
        source: /api/*
        destination: https://servorabd-api.onrender.com/api/*
      - type: rewrite
        source: /admin/*
        destination: https://servorabd-api.onrender.com/admin/*
      - type: rewrite
        source: /static/*
        destination: https://servorabd-api.onrender.com/static/*
      - type: rewrite
        source: /media/*
        destination: https://servorabd-api.onrender.com/media/*
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /app.html
