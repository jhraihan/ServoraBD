name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-only-key-not-used-anywhere-else-0123456789abcdefghijklmnop
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/servorabd

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servorabd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass the deploy checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: servorabd.example.com
          CSRF_TRUSTED_ORIGINS: https://servorabd.example.com
          EMAIL_HOST: smtp.example.com
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci
          DEFAULT_FROM_EMAIL: no-reply@example.com
          TRUSTED_PROXY_COUNT: "1"
        run: python manage.py check --deploy --fail-level WARNING
      - run: python -m pytest -W error::DeprecationWarning

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: servorabd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment and demo data
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
          venv/bin/python manage.py migrate --no-input
          venv/bin/python manage.py seed_catalogue
          venv/bin/python manage.py seed_demo --per-archetype 1
      - name: Frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Golden paths and accessibility
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Shipped dependencies have no known vulnerabilities
        run: npm audit --omit=dev
        working-directory: frontend
      - name: Build tools have no high or critical vulnerabilities
        run: npm audit --audit-level=high
        working-directory: frontend
